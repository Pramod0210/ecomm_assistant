[build-system]
requires = ["setuptools>=68"]         # newer setuptools, for PEP 660 editable installs
build-backend = "setuptools.build_meta"

[project]
name = "ecomm-assistant"
version = "0.1.0"
description = "Agentic RAG e-commerce assistant over scraped product reviews, with MCP-served retrieval and web search"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.116.1",
    "langchain==0.3.27",
    "python-dotenv==1.1.1",
    "streamlit==1.49.1",
]

authors = [{ name = "Pramod Kumar" }]
license = { text = "MIT" }
license-files = ["LICENSE"]

# CLI command, created after `python -m pip install -e .`
[project.scripts]
ecomm-assistant = "ecomm_assistant.cli:main"

[tool.setuptools.packages.find]
where = ["prod_assistant"]
include = ["ecomm_assistant*"]
